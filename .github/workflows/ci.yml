name: CI

on:
    pull_request:
        branches: [main]
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://teacoder.ru' }}
            NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.teacoder.ru' }}
            NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL || 'support@teacoder.ru' }}
            NEXT_PUBLIC_OWNER_NAME: ${{ vars.NEXT_PUBLIC_OWNER_NAME }}
            NEXT_PUBLIC_OWNER_INN: ${{ vars.NEXT_PUBLIC_OWNER_INN }}
            NEXT_PUBLIC_FPJS_API_KEY: ${{ vars.NEXT_PUBLIC_FPJS_API_KEY }}
            NEXT_PUBLIC_FPJS_ENDPOINT: ${{ vars.NEXT_PUBLIC_FPJS_ENDPOINT }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Build summary
              run: |
                  {
                    echo '### Build'
                    echo
                    echo "Standalone: \`$(du -sh .next/standalone | cut -f1)\`"
                    echo "Static: \`$(du -sh .next/static | cut -f1)\`"
                  } >> "$GITHUB_STEP_SUMMARY"
